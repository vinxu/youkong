name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - 'Backend/**'
      - 'Web/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Backend
        run: |
          cd Backend
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o youkong-server ./cmd/server/...
          tar -czvf youkong-backend.tar.gz youkong-server internal/

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youkong-backend
          path: Backend/youkong-backend.tar.gz

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web
        run: |
          cd Web
          npm ci
          npm run build
          tar -czvf youkong-web.tar.gz dist/

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youkong-web
          path: Web/youkong-web.tar.gz

  release:
    needs: [build-backend, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: youkong-backend

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: youkong-web

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            youkong-backend.tar.gz
            youkong-web.tar.gz
          body: |
            Auto build from commit ${{ github.sha }}

            **Backend**: youkong-backend.tar.gz
            **Web**: youkong-web.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
