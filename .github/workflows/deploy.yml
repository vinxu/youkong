name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]
    paths:
      - 'Backend/**'
  workflow_dispatch:  # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        run: |
          cd Backend
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o server ./cmd/server/...

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/youkong
            pkill -f "./server" || true

      - name: Upload Binary
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "Backend/server"
          target: "/opt/youkong/"
          strip_components: 1

      - name: Upload Source Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "Backend/internal/"
          target: "/opt/youkong/"
          strip_components: 1

      - name: Start Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/youkong
            chmod +x server
            nohup ./server > server.log 2>&1 &
            sleep 3
            curl -s http://localhost:8080/health && echo "Deploy success!" || echo "Deploy failed!"
