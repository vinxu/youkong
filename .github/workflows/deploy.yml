name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - 'Backend/**'
      - 'Web/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Backend
        run: |
          cd Backend
          go mod download
          VERSION="build-${{ github.run_number }}"
          COMMIT="${{ github.sha }}"
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildTime=${BUILD_TIME}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o server ./cmd/server/...
          tar -czvf youkong-backend.tar.gz server migrations/

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youkong-backend
          path: Backend/youkong-backend.tar.gz

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web
        run: |
          cd Web
          npm ci
          npm run build
          tar -czvf youkong-web.tar.gz dist/

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youkong-web
          path: Web/youkong-web.tar.gz

  release:
    needs: [build-backend, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: youkong-backend

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: youkong-web

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            youkong-backend.tar.gz
            youkong-web.tar.gz
          body: |
            Auto build from commit ${{ github.sha }}

            **Backend**: youkong-backend.tar.gz
            **Web**: youkong-web.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy Webhook
        run: |
          echo "Waiting for release to be available..."
          sleep 15

          echo "Triggering deploy webhook..."
          echo "Token length: ${#DEPLOY_TOKEN}"

          # 增加超时时间到 5 分钟（部署需要下载文件）
          response=$(curl -s -w "\n%{http_code}" --max-time 300 -X POST "http://49.232.13.41:8080/deploy?token=${DEPLOY_TOKEN}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)

          echo "Response: $body"
          echo "HTTP Code: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "Deploy failed with HTTP $http_code"
            exit 1
          fi

          echo "Deploy triggered successfully!"
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
