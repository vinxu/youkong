name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - 'Backend/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Linux Binary
        run: |
          cd Backend
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o youkong-server ./cmd/server/...
          tar -czvf youkong-backend.tar.gz youkong-server internal/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youkong-backend
          path: Backend/youkong-backend.tar.gz

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: Backend/youkong-backend.tar.gz
          body: |
            Auto build from commit ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
