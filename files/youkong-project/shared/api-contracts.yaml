openapi: 3.0.0
info:
  title: YouKong API
  description: 有空 - 低压力社交预约工具 API
  version: 1.0.0

servers:
  - url: https://api.youkong.app/v1
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    # 基础响应
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          description: 0=成功
        message:
          type: string
        data:
          type: object

    PaginatedResponse:
      type: object
      properties:
        items:
          type: array
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer

    # 用户
    User:
      type: object
      required: [id, nickname, createdAt, lastActiveAt]
      properties:
        id:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        phone:
          type: string
        createdAt:
          type: integer
          format: int64
        lastActiveAt:
          type: integer
          format: int64

    # 圈子
    Circle:
      type: object
      required: [id, name, emoji, color, ownerId, memberIds, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 10
        emoji:
          type: string
        color:
          type: string
          description: Hex color
        ownerId:
          type: string
        memberIds:
          type: array
          items:
            type: string
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64

    # 有空状态
    Availability:
      type: object
      required: [id, userId, startTime, endTime, location, visibleCircleIds, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        startTime:
          type: integer
          format: int64
        endTime:
          type: integer
          format: int64
        location:
          $ref: '#/components/schemas/AvailabilityLocation'
        visibleCircleIds:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ACTIVE, EXPIRED, CANCELLED, FULFILLED]
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64

    AvailabilityLocation:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [PRESET, FLEXIBLE, CUSTOM]
        name:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        radius:
          type: integer
          description: 范围（米）

    AvailabilityWithUser:
      allOf:
        - $ref: '#/components/schemas/Availability'
        - type: object
          properties:
            user:
              $ref: '#/components/schemas/User'

    # 请求体
    CreateAvailabilityRequest:
      type: object
      required: [startTime, endTime, location, visibleCircleIds]
      properties:
        startTime:
          type: integer
          format: int64
        endTime:
          type: integer
          format: int64
        location:
          $ref: '#/components/schemas/AvailabilityLocation'
        visibleCircleIds:
          type: array
          items:
            type: string
          minItems: 1

    CreateCircleRequest:
      type: object
      required: [name, emoji]
      properties:
        name:
          type: string
          maxLength: 10
        emoji:
          type: string

    AddMembersRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          items:
            type: string

    # AI 相关
    AnalyzeContactsRequest:
      type: object
      required: [contacts]
      properties:
        contacts:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              phoneHash:
                type: string
              tags:
                type: array
                items:
                  type: string
        groupSources:
          type: array
          items:
            type: object
            properties:
              groupName:
                type: string
              timestamp:
                type: integer

    AICircleSuggestion:
      type: object
      properties:
        name:
          type: string
        emoji:
          type: string
        members:
          type: array
          items:
            type: string
        reason:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 5

paths:
  # 认证
  /auth/wechat:
    post:
      summary: 微信登录
      tags: [认证]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                          expiresIn:
                            type: integer
                          user:
                            $ref: '#/components/schemas/User'

  /auth/sms/send:
    post:
      summary: 发送验证码
      tags: [认证]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
      responses:
        '200':
          description: 成功

  /auth/sms/verify:
    post:
      summary: 验证码登录
      tags: [认证]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: 成功

  # 有空状态
  /availabilities/friends:
    get:
      summary: 获取朋友的有空状态
      tags: [有空状态]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PaginatedResponse'
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/AvailabilityWithUser'

  /availabilities:
    post:
      summary: 发布有空状态
      tags: [有空状态]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAvailabilityRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Availability'

  /availabilities/{id}:
    delete:
      summary: 取消有空状态
      tags: [有空状态]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功

  # 圈子
  /circles:
    get:
      summary: 获取我的圈子
      tags: [圈子]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Circle'

    post:
      summary: 创建圈子
      tags: [圈子]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCircleRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Circle'

  /circles/{id}:
    put:
      summary: 编辑圈子
      tags: [圈子]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCircleRequest'
      responses:
        '200':
          description: 成功

    delete:
      summary: 删除圈子
      tags: [圈子]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功

  /circles/{id}/members:
    post:
      summary: 添加成员
      tags: [圈子]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMembersRequest'
      responses:
        '200':
          description: 成功

  /circles/{id}/members/{userId}:
    delete:
      summary: 移除成员
      tags: [圈子]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功

  # AI 服务
  /ai/analyze-contacts:
    post:
      summary: AI分析联系人，生成圈子建议
      tags: [AI服务]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeContactsRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          circles:
                            type: array
                            items:
                              $ref: '#/components/schemas/AICircleSuggestion'

  /ai/suggest-circle-name:
    post:
      summary: AI生成圈子名称建议
      tags: [AI服务]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members]
              properties:
                members:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          suggestions:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                emoji:
                                  type: string
